# Stand-in model service configuration
# Reproduces Groq API behavior with lognormal TTFT, load curve, token buckets, and fault injection

ttft_distribution:
  mu: 5.25            # Log(ms) mean (~190ms median) fitted from empirical probes
  sigma: 0.35         # Log(ms) standard deviation

generation:
  tokens_per_second: 240.0  # Token streaming generation rate (tokens/s)

rate_limits:
  requests_per_minute: 30       # Discovered Groq free-tier rate ceiling
  tokens_per_minute: 14400      # Discovered Groq free-tier token ceiling
  daily_requests_limit: 14400   # Daily request ceiling
  daily_tokens_limit: 500000    # Daily token ceiling

load_curve:
  knee: 4             # In-flight concurrency knee threshold before progressive queue slowdown
  alpha: 0.25         # Slowdown scale multiplier
  beta: 1.5           # Non-linear queue penalty exponent

fault_injection:
  p_drop: 0.00        # Simulated socket connection drops
  p_500: 0.01         # Simulated transient 500 errors
  p_slowdown: 0.05    # Simulated sudden tail latency spikes (3x)
  p_rate_limit: 0.00  # Explicit manual 429 injection

simulation:
  time_dilation: 0.05 # Accelerated simulation factor for deterministic fast test runs
  seed: 42            # Deterministic random seed for test reproducibility
