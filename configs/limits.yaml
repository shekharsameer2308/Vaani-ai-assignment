# Rate limits, timeouts, and quota thresholds
# All tunable thresholds marked with # CHOOSE per project rules

rate_limits:
  requests_per_minute: 30       # CHOOSE: Groq free tier measured default
  tokens_per_minute: 14400      # CHOOSE: Groq free tier measured default (or 6000 for 70b)
  daily_requests_limit: 14400   # CHOOSE: Daily free tier quota cap
  daily_tokens_limit: 500000    # CHOOSE: Daily free tier token budget

pipeline:
  max_wait_seconds: 5.0         # CHOOSE: Max time to wait for bucket slot before falling back
  in_flight_semaphore: 5        # CHOOSE: Max concurrent in-flight requests to avoid queue saturation
  absence_threshold: 12.0       # CHOOSE: Min BM25 score to consider question in-domain
  min_term_coverage: 0.35       # CHOOSE: Fraction of query terms required in retrieved passages
  max_retries: 2                # CHOOSE: Max retries on rate limit or pre-token 5xx
  timeout_seconds: 30.0         # CHOOSE: Per-request deadline
