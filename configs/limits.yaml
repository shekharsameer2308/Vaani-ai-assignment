# Rate limits, timeouts, and quota thresholds
# Calibrated for Groq llama-3.1-8b-instant free tier

rate_limits:
  requests_per_minute: 30       # Groq free tier measured limit
  tokens_per_minute: 14400      # Groq free tier measured token rate
  daily_requests_limit: 14400   # Daily free tier request quota
  daily_tokens_limit: 500000    # Daily free tier token ceiling

pipeline:
  max_wait_seconds: 5.0         # Max queue wait time before falling back
  in_flight_semaphore: 5        # Max concurrent in-flight requests to avoid queue saturation
  absence_threshold: 12.0       # Minimum BM25 score to consider question in-domain
  min_term_coverage: 0.35       # Fraction of query terms required in retrieved passages
  max_retries: 2                # Max retries on rate limit or pre-token 5xx
  timeout_seconds: 30.0         # Per-request deadline
